  <!-- Product marker -->
  <circle cx="102" cy="103" r="21" fill="#9D174D" stroke="#FFFFFF" stroke-width="3"/>
  <g aria-hidden="true"><circle cx="93" cy="108" r="2.4" fill="#fff"/><path d="M96 106c4-6 8-9 14-9m-10 14c4-4 8-6 13-6m-4-12 4 4-4 4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
